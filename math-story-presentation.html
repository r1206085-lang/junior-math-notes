<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <title>5 分鐘愛上數學奇聞｜教學簡報</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, svg: { fontCache: 'global' } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: #171717; color: #fafaf9; }
    header, footer { padding: .8rem clamp(1rem, 4vw, 3rem); background: #1c1917; }
    header { border-bottom: 1px solid #44403c; } footer { border-top: 1px solid #44403c; }
    .toolbar, .controls { max-width: 1100px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
    a, button { color: inherit; } .link { text-decoration: none; padding: .45rem .7rem; border-radius: .55rem; background: #292524; font-size: .9rem; }
    button { border: 0; border-radius: .7rem; padding: .7rem 1.1rem; font-weight: 800; cursor: pointer; background: #fbbf24; color: #1c1917; }
    button.secondary { background: #292524; color: #fafaf9; } button:disabled { opacity: .4; cursor: not-allowed; }
    main { width: min(1100px, 94vw); margin: auto; padding: 1.3rem 0; display: grid; place-items: center; }
    .slide { display: none; width: 100%; min-height: min(70vh, 650px); padding: clamp(1.3rem, 4vw, 3rem); color: #1c1917; background: #faf7f2; border: 5px solid #44403c; border-radius: 1.3rem; box-shadow: 0 24px 70px #0008; }
    .slide.active { display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; }
    .eyebrow { color: #be123c; font-weight: 900; letter-spacing: .06em; }
    .content { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 2rem; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.12; margin: .4rem 0 1rem; }
    .hook { border-left: 5px solid #be123c; padding: .75rem 1rem; background: white; font-size: 1.15rem; font-weight: 750; }
    ul { padding-left: 1.2rem; line-height: 1.8; } li::marker { color: #be123c; }
    .visual { padding: 1rem; background: white; border: 2px solid #292524; border-radius: 1rem; text-align: center; }
    .visual svg { width: 100%; max-height: 260px; }
    .note { margin-top: .8rem; padding: .75rem; background: #fef3c7; border-radius: .7rem; font-weight: 700; }
    .wiki { color: #9f1239; font-weight: 800; }
    #progress { height: 4px; background: #44403c; margin-top: .8rem; } #bar { height: 100%; width: 20%; background: #fbbf24; transition: width .2s; }
    #count { color: #fbbf24; font-family: ui-monospace, monospace; font-weight: 800; }
    @media (max-width: 720px) { .content { grid-template-columns: 1fr; gap: 1rem; } .slide { min-height: 75vh; } .visual svg { max-height: 180px; } }
    @media print { body { background: white; display: block; } header, footer { display: none; } main { display: block; width: 100%; padding: 0; } .slide, .slide.active { display: grid !important; height: 100vh; border: 0; box-shadow: none; page-break-after: always; } }
  </style>
</head>
<body>
  <header>
    <div class="toolbar">
      <nav aria-label="主要導覽"><a class="link" href="index.html">🏠 總首頁</a> <a class="link" href="數學科普/index.html">📰 數學故事 Wiki</a></nav>
      <span id="count" aria-live="polite">1 / 5</span>
    </div>
    <div id="progress" aria-hidden="true"><div id="bar"></div></div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <footer>
    <div class="controls">
      <button class="secondary" id="prev" type="button">← 上一頁</button>
      <span>使用 ← →、PageUp / PageDown 或空白鍵翻頁</span>
      <button id="next" type="button">下一頁 →</button>
    </div>
  </footer>
  <script>
    const stories = [
      { title: '希帕索斯與無理數：正方形的對角線', label: '01 • 一條對角線，改變數學世界', hook: '邊長是 1 的正方形，對角線長是多少？答案是 $\\sqrt{2}$，而且它不能寫成兩整數之比。', points: ['由畢氏定理：$d^2=1^2+1^2=2$，所以 $d=\\sqrt{2}$。', '反證法可證明 $\\sqrt{2}$ 不是有理數：假設它是最簡分數，平方後分子、分母都必須是偶數，矛盾。', '無理數揭示：數線上的數，並不都能表示成分數。'], fact: '傳說希帕索斯因揭露無理數而遭遇悲劇；這段故事的細節多來自後世傳述，史實仍有爭議。', url: '數學科普/hippasus-irrational.html', svg: '<svg viewBox="0 0 300 220" role="img" aria-label="正方形對角線長根號二"><rect x="55" y="25" width="150" height="150" fill="#fff1f2" stroke="#292524" stroke-width="3"/><line x1="55" y1="175" x2="205" y2="25" stroke="#be123c" stroke-width="4"/><text x="115" y="202" font-size="16">邊長 1</text><text x="94" y="92" fill="#be123c" font-size="18" transform="rotate(-45 120 100)">對角線 √2</text></svg>' },
      { title: '笛卡兒心型線：用方程式畫出心', label: '02 • 幾何與代數的浪漫相遇', hook: '一條曲線能不能同時是方程式，也是心形？笛卡兒心型線給出漂亮的答案。', points: ['常見心型線可寫成 $(x^2+y^2-1)^3=x^2y^3$。', '它是笛卡兒葉形線的一種特例，曲線在原點形成尖點，整體呈現心形輪廓。', '方程式把每個座標點的關係寫清楚；繪圖時，代數便成了幾何的語言。'], fact: '笛卡兒葉形線的一般形式為 $x^3+y^3=3axy$；不同參數會改變曲線的大小。', url: '數學科普/descartes-heart.html', svg: '<svg viewBox="0 0 300 220" role="img" aria-label="心型曲線示意圖"><path d="M150 177 C125 154 42 100 66 57 C87 20 132 38 150 69 C168 38 213 20 234 57 C258 100 175 154 150 177Z" fill="#fb7185" stroke="#9f1239" stroke-width="4"/><text x="77" y="210" font-size="14">一條方程式，描出心形輪廓</text></svg>' },
      { title: '阿基米德的「我找到了！」', label: '03 • 浮力與皇冠的謎題', hook: '國王想知道皇冠是不是純金。阿基米德如何在不破壞皇冠的情況下檢驗？', points: ['物體浸入液體，會排開一定體積的液體；液面上升可用來估計不規則物體體積。', '若知道皇冠的質量與體積，就能比較密度是否符合純金。', '浮力大小等於物體所排開流體的重量，這就是阿基米德原理。'], fact: '「裸身跑出浴場大喊 Eureka」是流傳甚廣的故事版本；科學重點是排液法與密度。', url: '數學科普/archimedes-eureka.html', svg: '<svg viewBox="0 0 300 220" role="img" aria-label="水盆與排開液體"><path d="M45 75h210l-20 110H65z" fill="#bae6fd" stroke="#292524" stroke-width="4"/><path d="M50 110h200" stroke="#0284c7" stroke-width="5"/><path d="M117 103l23-35h27l20 35v40h-70z" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><path d="M150 58V35m-9 10 9-10 9 10" fill="none" stroke="#be123c" stroke-width="4"/><text x="70" y="210" font-size="14">排液量可用來推估體積</text></svg>' },
      { title: '柯尼斯堡七橋：走遍每座橋一次', label: '04 • 圖論從一場散步挑戰開始', hook: '能否從任一地點出發，每座橋恰好走一次？歐拉把地圖化成點與線來回答。', points: ['把每塊陸地看成頂點，把橋看成連接頂點的邊。', '一筆走完所有邊的路徑，最多只能有兩個奇數度頂點（起點與終點）。', '七橋問題的四個頂點度數全是奇數，因此無法每橋只走一次。'], fact: '歐拉 1736 年對柯尼斯堡七橋問題的分析，常被視為圖論的重要起點。', url: '數學科普/konigsberg-bridges.html', svg: '<svg viewBox="0 0 300 220" role="img" aria-label="四個頂點與橋的圖示"><path d="M75 65L220 55M75 65L80 165M220 55L220 165M80 165L220 165M75 65L220 165M220 55L80 165M75 65L80 165" fill="none" stroke="#be123c" stroke-width="4"/><g fill="#fbbf24" stroke="#292524" stroke-width="3"><circle cx="75" cy="65" r="18"/><circle cx="220" cy="55" r="18"/><circle cx="80" cy="165" r="18"/><circle cx="220" cy="165" r="18"/></g><text x="75" y="210" font-size="14">頂點代表陸地，邊代表橋</text></svg>' },
      { title: '費波那契與黃金比例：自然界的數列', label: '05 • 兔子、花瓣與螺旋', hook: '數列 $1,1,2,3,5,8,13,\\ldots$ 每一項（從第三項起）都是前兩項相加。', points: ['相鄰費波那契數的比值逐漸接近黃金比例 $\\varphi=(1+\\sqrt{5})/2$。', '向日葵種子排列常呈現兩組螺旋；數量有時接近相鄰費波那契數。', '這是觀察自然的數學模型，不代表所有植物都遵循同一固定規則。'], fact: '黃金比例約為 1.618；數列比值逼近它，但有限項的比值並不等於它。', url: '數學科普/fibonacci-golden-ratio.html', svg: '<svg viewBox="0 0 300 220" role="img" aria-label="費波那契螺旋示意圖"><rect x="45" y="35" width="80" height="80" fill="#fef3c7" stroke="#292524" stroke-width="2"/><rect x="125" y="35" width="50" height="50" fill="#fde68a" stroke="#292524" stroke-width="2"/><rect x="125" y="85" width="50" height="50" fill="#fef3c7" stroke="#292524" stroke-width="2"/><path d="M45 115 A80 80 0 0 1 125 35 M125 35 A50 50 0 0 1 175 85 M175 85 A50 50 0 0 1 125 135 M125 135 A80 80 0 0 1 45 55" fill="none" stroke="#be123c" stroke-width="4"/><text x="50" y="190" font-size="15">1, 1, 2, 3, 5, 8, 13, …</text></svg>' }
    ];
    let current = 0;
    const stage = document.getElementById('stage');
    function slideFromHash() { const n = Number(location.hash.replace('#slide-', '')); if (Number.isInteger(n) && n >= 1 && n <= stories.length) current = n - 1; }
    function render() {
      const s = stories[current];
      stage.innerHTML = `<article class="slide active"><div class="toolbar"><span class="eyebrow">${s.label}</span><a class="wiki" href="${s.url}">📖 閱讀 Wiki 全文 →</a></div><div class="content"><section><h1>${s.title}</h1><p class="hook">${s.hook}</p><ul>${s.points.map(p => `<li>${p}</li>`).join('')}</ul></section><aside class="visual">${s.svg}<div class="note">💡 ${s.fact}</div></aside></div><div class="eyebrow">數學故事 • ${String(current + 1).padStart(2, '0')} / 05</div></article>`;
      document.getElementById('count').textContent = `${current + 1} / ${stories.length}`;
      document.getElementById('bar').style.width = `${(current + 1) / stories.length * 100}%`;
      document.getElementById('prev').disabled = current === 0;
      document.getElementById('next').disabled = current === stories.length - 1;
      history.replaceState(null, '', `#slide-${current + 1}`);
      if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([stage]);
    }
    function go(delta) { const next = current + delta; if (next >= 0 && next < stories.length) { current = next; render(); } }
    document.getElementById('prev').addEventListener('click', () => go(-1));
    document.getElementById('next').addEventListener('click', () => go(1));
    document.addEventListener('keydown', e => { if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); } if (['ArrowLeft', 'PageUp'].includes(e.key)) go(-1); });
    window.addEventListener('hashchange', () => { slideFromHash(); render(); });
    slideFromHash(); render();
  </script>
</body>
</html>
